<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giant Burger Run</title>
  <meta name="theme-color" content="#ff7a45">
  <meta name="description" content="Giant Burger Run: كدّس أطول برجر، اجري عبر 18 عالم، واجمع أشكال الشيف.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffb347, #ff7a45);
      color: #fff;
      padding: 24px;
      text-align: center;
    }
    .wrap {
      max-width: 760px;
      width: 100%;
      animation: rise .7s ease;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .burger {
      font-size: 80px;
      margin-bottom: 18px;
      display: inline-block;
      animation: bob 2.4s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }
    h1 {
      font-size: clamp(2.3rem, 5vw, 4rem);
      margin: 0 0 12px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-shadow: 2px 2px 0 rgba(0,0,0,.15);
    }
    p {
      margin: 0 auto 30px;
      max-width: 620px;
      font-size: 1.1rem;
      line-height: 1.7;
      opacity: 0.96;
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
      margin-top: 10px;
    }
    .btn {
      display: inline-block;
      padding: 16px 28px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      transition: .2s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,.18);
    }
    .btn:hover { transform: translateY(-2px); }
    .primary {
      background: #fff;
      color: #ff7a45;
    }
    .secondary {
      background: rgba(255,255,255,.14);
      color: #fff;
      border: 2px solid rgba(255,255,255,.75);
    }
    .grid {
      margin-top: 40px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 14px;
    }
    .card {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 18px;
      padding: 18px 12px;
      backdrop-filter: blur(4px);
    }
    .icon { font-size: 32px; margin-bottom: 8px; }
    .card span {
      display: block;
      font-weight: 700;
      font-size: 0.95rem;
    }
    footer {
      margin-top: 26px;
      opacity: 0.9;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="burger">🍔</div>
    <h1>Giant Burger Run</h1>
    <p>
      كدّس أطول برجر، اجري عبر 18 عالم، اجمع مكافآت الشيف، واهزم التحديات في كل مستوى.
    </p>

    <div class="buttons">
      <a class="btn primary" href="privacy.html">📋 سياسة الخصوصية</a>
      <a class="btn secondary" href="#">🎮 العب الآن</a>
    </div>

    <div class="grid">
      <div class="card">
        <div class="icon">🏆</div>
        <span>18 عالم</span>
      </div>
      <div class="card">
        <div class="icon">👨‍🍳</div>
        <span>مظهر شيف</span>
      </div>
      <div class="card">
        <div class="icon">🎯</div>
        <span>تحدي متواصل</span>
      </div>
      <div class="card">
        <div class="icon">🍟</div>
        <span>برجر ضخم</span>
      </div>
    </div>

    <footer>© 2026 Giant Burger Run</footer>
  </div>
</body>
</html>
